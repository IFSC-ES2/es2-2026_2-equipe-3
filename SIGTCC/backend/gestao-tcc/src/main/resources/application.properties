spring.application.name=gestao-tcc

spring.docker.compose.enabled=false

# Configurações de conexão para o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestao_tcc
spring.datasource.username=admin
spring.datasource.password=senha_secreta
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA e Flyway
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

