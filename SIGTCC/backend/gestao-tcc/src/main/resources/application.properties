xspring.application.name=gestao-tcc

spring.docker.compose.enabled=false

# ConfiguraÁıes de conex„o para o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestao_tcc
spring.datasource.username=admin
spring.datasource.password=senha_secreta
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ConfiguraÁıes do Hibernate / JPA e Flyway
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/sigtcc
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/sigtcc/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=sigtcc-backend
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Lista de dom√≠nios confi√°veis sugeridos ao aluno na interface de submiss√£o de entregas (ADR-0013).
# Trata-se apenas de uma sugest√£o/dica de UX: qualquer URL https:// v√°lida √© aceita pelo backend,
# independentemente de pertencer a um destes dom√≠nios.
app.submissao.dominios-sugeridos=${APP_SUBMISSAO_DOMINIOS_SUGERIDOS:drive.google.com,github.com,onedrive.live.com}

