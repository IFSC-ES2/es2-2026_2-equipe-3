name: Verificação de Documentação

on:
  push:
    branches:
      - main
      - "entrega-*"
  pull_request:
    branches:
      - main
      - "entrega-*"

jobs:
  verificar-arquivos:
    name: Checar Arquivos Essenciais
    runs-on: ubuntu-latest

    steps:
      - name: Fazer o checkout do código
        uses: actions/checkout@v4

      - name: Verificar se o README existe
        run: |
          echo "Buscando o arquivo README.md..."
          if [ -f "README.md" ]; then
            echo "O README.md foi encontrado."
            exit 0
          else
            echo "Erro: O arquivo README.md foi removido ou não existe."
            exit 1
          fi

      - name: Validar sintaxe do docker-compose
        run: |
          docker compose -f SIGTCC/docker-compose.yml config -q
          docker compose -f SIGTCC/docker-compose.prod.yml config -q

      # Verifica apenas links internos (arquivos relativos e âncoras de seção).
      # O modo --offline ignora URLs externas, então o check não depende de sites de terceiros.
      - name: Verificar links internos da documentação
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path node_modules
            './**/*.md'
          fail: true
