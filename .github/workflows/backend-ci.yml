name: Backend CI - Build e Testes Automatizados

on:
  push:
    branches:
      - main
      - "entrega-*"
  pull_request:
    branches:
      - main
      - "entrega-*"

jobs:
  build-and-test:
    name: Compilar e Rodar Testes Unitarios (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Dar permissao de execucao ao Gradle Wrapper
        run: chmod +x backend/gestao-tcc/gradlew

      - name: Executar testes de unidade
        working-directory: backend/gestao-tcc
        run: ./gradlew test

      - name: Upload dos relatorios de testes (Artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-gradle
          path: backend/gestao-tcc/build/reports/tests/test/
