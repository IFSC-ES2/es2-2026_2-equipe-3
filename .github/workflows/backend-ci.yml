name: Backend CI - Build e Testes Automatizados

on:
  push:
    branches:
      - main
      - "entrega-*"
  pull_request:
    branches:
      - main
      - "entrega-*"

jobs:
  build-and-test:
    name: Compilar e Rodar Testes Unitarios (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Verificar alterações no backend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'SIGTCC/backend/**'
              - '.github/workflows/backend-ci.yml'

      - name: Configurar JDK 21
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Dar permissao de execucao ao Gradle Wrapper
        if: steps.filter.outputs.backend == 'true'
        run: chmod +x SIGTCC/backend/gestao-tcc/gradlew

      - name: Compilar e executar testes
        if: steps.filter.outputs.backend == 'true'
        working-directory: SIGTCC/backend/gestao-tcc
        run: ./gradlew build

      - name: Upload dos relatorios de testes (Artefato)
        if: always() && steps.filter.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-gradle
          path: SIGTCC/backend/gestao-tcc/build/reports/tests/test/
