name: Build Docker Images (Staging)

on:
  push:
    branches:
      - "entrega-8"

jobs:
  build-and-push:
    name: Build e Push das Imagens Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - Backend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/backend/gestao-tcc
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-backend:latest
            ghcr.io/ifsc-es2/sigtcc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/frontend
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-frontend:latest
            ghcr.io/ifsc-es2/sigtcc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
