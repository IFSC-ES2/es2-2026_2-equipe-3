name: Build Docker Images (Staging)

on:
  push:
    branches:
      - "entrega-8"

jobs:
  test-backend:
    name: Testar Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Dar permissão e executar testes do backend
        working-directory: SIGTCC/backend/gestao-tcc
        run: |
          chmod +x gradlew
          ./gradlew test

  test-frontend:
    name: Testar Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIGTCC/frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "SIGTCC/frontend/package-lock.json"

      - name: Instalar dependências e testar
        run: |
          npm ci
          npm test

  build-and-push:
    name: Build e Push das Imagens Docker
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - Backend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/backend/gestao-tcc
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-backend:latest
            ghcr.io/ifsc-es2/sigtcc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/frontend
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-frontend:latest
            ghcr.io/ifsc-es2/sigtcc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL }}
            VITE_KEYCLOAK_URL=${{ vars.STAGING_KEYCLOAK_URL }}
