name: Build Docker Images (Staging)

on:
  workflow_run:
    workflows: ["Backend CI - Build e Testes Automatizados", "Frontend CI"]
    types: [completed]
    branches: ["entrega-8"]

jobs:
  build-and-push:
    name: Build e Push das Imagens Docker
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - Backend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/backend/gestao-tcc
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-backend:latest
            ghcr.io/ifsc-es2/sigtcc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: SIGTCC/frontend
          push: true
          tags: |
            ghcr.io/ifsc-es2/sigtcc-frontend:latest
            ghcr.io/ifsc-es2/sigtcc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL }}
            VITE_KEYCLOAK_URL=${{ vars.STAGING_KEYCLOAK_URL }}
