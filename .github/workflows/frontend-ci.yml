name: Frontend CI

on:
  push:
    branches:
      - main
      - "entrega-*"
      - "feature/*"

  pull_request:
    branches:
      - main
      - "entrega-*"

jobs:
  build-and-test:
    name: Compilar, Testar e Gerar Build (Frontend)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SIGTCC/frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar alterações no frontend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'SIGTCC/frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Determinar se deve executar testes
        id: check-run
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js
        if: steps.check-run.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "SIGTCC/frontend/package-lock.json"

      - name: Instalar dependências
        if: steps.check-run.outputs.should_run == 'true'
        run: npm ci

      - name: Executar Linting
        if: steps.check-run.outputs.should_run == 'true'
        run: npm run lint

      - name: Executar Testes Unitários (Vitest)
        if: steps.check-run.outputs.should_run == 'true'
        run: npm test

      - name: Executar Build
        if: steps.check-run.outputs.should_run == 'true'
        run: npm run build
