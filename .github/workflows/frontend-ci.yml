name: Frontend CI

on:
  push:
    branches:
      - main
      - "entrega-*"
      - "feature/*"

  pull_request:
    branches:
      - main
      - "entrega-*"

jobs:
  build-and-test:
    name: Compilar, Testar e Gerar Build (Frontend)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SIGTCC/frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar alterações no frontend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'SIGTCC/frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Configurar Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "SIGTCC/frontend/package-lock.json"

      - name: Instalar dependências
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Executar Linting
        if: steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Executar Testes Unitários (Vitest)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run test

      - name: Executar Build
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build
